<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window A - Ground truth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="stage"><canvas id="map"></canvas></main>

<header id="hud" class="float">
<span id="link" class="link" data-state="connecting" title="connecting"></span>
<span class="brand">Window A</span>
<span class="stat"><i>Tick</i><b id="hud-tick">0</b></span>
<span class="stat"><i>Time</i><b id="hud-time">0 s</b></span>
<span id="hud-state" class="state" data-state="running">Running</span>
<span class="sep"></span>
<button id="toggle" type="button">Pause</button>
<button type="button" data-step="1">Step 1</button>
<button type="button" data-step="10">Step 10</button>
<button id="terminal-toggle" type="button">Terminal</button>
<label class="speed"><span>Speed</span>
<select id="speed" aria-label="Simulation speed">
<option value="0.5">0.5x</option>
<option value="1" selected>1x</option>
<option value="2">2x</option>
<option value="4">4x</option>
</select>
</label>
</header>

<nav id="crumb" class="float" aria-label="View">
<button type="button" id="crumb-world">WORLD</button>
<span id="crumb-sep" hidden>&gt;</span>
<b id="crumb-name" hidden></b>
</nav>

<div id="side">
<section id="dossier" class="panel" hidden></section>
<aside id="inspector" class="panel" hidden></aside>
<section id="terminal" class="panel" aria-label="Operator terminal" hidden>
<header><h1>Operator terminal</h1></header>
<div id="terminal-log" role="log" aria-live="polite"></div>
<form id="terminal-form" autocomplete="off">
<label id="terminal-prompt" for="terminal-input">&gt;</label>
<input id="terminal-input" type="text" spellcheck="false" autocapitalize="off" maxlength="2100">
</form>
</section>
</div>

<section id="log" class="float" data-open="false">
<header><button type="button" id="log-toggle" aria-expanded="false">Events</button><span id="log-hint">click to expand</span></header>
<ol id="log-list"></ol>
</section>

<nav id="camera" class="float" aria-label="Camera">
<button type="button" id="cam-world" title="World view">World</button>
<button type="button" id="cam-theatre" title="Theatre view (Europe)">Theatre</button>
<button type="button" id="cam-in" title="Zoom in" aria-label="Zoom in">+</button>
<button type="button" id="cam-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
<button type="button" id="cam-tilt" title="Flat or oblique">Tilt</button>
<button type="button" id="cam-reset" title="Reset view" aria-label="Reset view">&#8634;</button>
<button type="button" id="cam-manual" title="Symbol manual (L)" aria-label="Symbol manual">?</button>
</nav>

<aside id="mini" class="float" hidden></aside>
<section id="manual" class="panel" hidden role="dialog" aria-label="Symbol manual"></section>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
