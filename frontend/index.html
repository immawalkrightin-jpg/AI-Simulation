<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window A - Ground truth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="stage"><canvas id="map"></canvas></main>
<section id="telemetry" class="panel">
<header><span id="link" class="link" data-state="connecting"></span><h1>Window A, ground truth</h1></header>
<dl id="clock" class="rows"></dl>
<h2>Countries</h2>
<div id="countries"></div>
<h2>Relations</h2>
<dl id="relations" class="rows"></dl>
<h2>Operations</h2>
<ol id="operations"></ol>
<h2>Events</h2>
<ol id="events"></ol>
<h2>Line language</h2>
<dl class="rows legend">
<dt><svg viewBox="0 0 40 10"><line class="w" x1="0" y1="5" x2="40" y2="5" stroke-dasharray="6 6"/></svg></dt><dd>Negotiation</dd>
<dt><svg viewBox="0 0 40 10"><line class="w" x1="0" y1="5" x2="40" y2="5"/><path class="w f" d="M20 1L24 5L20 9L16 5Z"/></svg></dt><dd>Talks concluded</dd>
<dt><svg viewBox="0 0 40 10"><line class="w" x1="0" y1="5" x2="40" y2="5"/><rect class="w f" x="34" y="2" width="6" height="6"/></svg></dt><dd>Supply, ground</dd>
<dt><svg viewBox="0 0 40 10"><line class="w" x1="0" y1="5" x2="40" y2="5" stroke-dasharray="2 5"/></svg></dt><dd>Supply, naval</dd>
<dt><svg viewBox="0 0 40 10"><line class="w" x1="0" y1="5" x2="40" y2="5" stroke-dasharray="12 6"/></svg></dt><dd>Supply, air</dd>
<dt><svg viewBox="0 0 40 10"><line class="r" x1="0" y1="5" x2="28" y2="5" stroke-dasharray="10 4"/><path class="r" d="M30 1L38 9M38 1L30 9"/></svg></dt><dd>Lost or collapsed</dd>
<dt><svg viewBox="0 0 40 10"><line class="r" x1="0" y1="5" x2="14" y2="5" stroke-dasharray="10 4"/><path class="r" d="M18 1H16V3M22 1H24V3M18 9H16V7M22 9H24V7"/><line class="r" x1="26" y1="5" x2="40" y2="5" stroke-dasharray="10 4"/></svg></dt><dd>Clash</dd>
<dt><svg viewBox="0 0 40 10"><path class="r" d="M0 9Q20 -8 40 9"/><circle class="r f" cx="20" cy="2.5" r="2"/></svg></dt><dd>Missile</dd>
<dt><svg viewBox="0 0 40 10"><line class="r faint" x1="0" y1="5" x2="40" y2="5" stroke-dasharray="1 5"/></svg></dt><dd>Hostile relation</dd>
<dt><svg viewBox="0 0 40 10"><line class="w faint" x1="0" y1="5" x2="40" y2="5"/></svg></dt><dd>Allied relation</dd>
</dl>
</section>
<aside id="inspector" class="panel" hidden></aside>
<nav id="controls">
<button id="toggle" type="button">Pause</button>
<button type="button" data-step="1">Step 1</button>
<button type="button" data-step="10">Step 10</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
